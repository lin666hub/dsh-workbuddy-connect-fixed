name: Request missing installation logs

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: install-issue-reply-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./.github/scripts/install-issue-reply.cjs')
            await run({ github, context })
