name: Close installation reports awaiting logs

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview eligible issues without commenting or closing
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: install-issue-timeout
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test .github/scripts/install-issue-*.test.cjs
      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./.github/scripts/install-issue-timeout.cjs')
            await run({
              github,
              context,
              dryRun: context.eventName === 'workflow_dispatch' && context.payload.inputs?.dry_run !== 'false',
              log: message => core.info(message),
            })
